[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fair-publishing"
version = "0.1.0"
description = "Publish datasets and models from a Flask app to Zenodo with FAIR metadata, under the user's own account."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Shashank Chakravarthy" }]
keywords = ["FAIR", "Zenodo", "DataCite", "RO-Crate", "research data", "Flask"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: Flask",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "Flask>=2.3,<4",
    "SQLAlchemy>=2.0,<3",
    "requests>=2.31,<3",
]

[project.urls]
Homepage = "https://github.com/shashankmc/fair-publishing"
Repository = "https://github.com/shashankmc/fair-publishing"
Issues = "https://github.com/shashankmc/fair-publishing/issues"
Changelog = "https://github.com/shashankmc/fair-publishing/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "Flask-SQLAlchemy>=3.0.5,<4",
    "PyYAML>=6.0",  # tests/test_openapi.py reads docs/openapi.yaml
    "alembic>=1.13",  # tests/test_migrations.py runs the revision; hosts supply it at runtime
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
